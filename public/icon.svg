<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark luxury background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141622" />
      <stop offset="100%" stop-color="#0A0B10" />
    </linearGradient>

    <!-- Warm Burnt Orange / Sunset Vibrant Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A" />
      <stop offset="60%" stop-color="#F2512E" />
      <stop offset="100%" stop-color="#C83311" />
    </linearGradient>

    <!-- Violet / Lavender Complementary Accent Gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F23D1" />
      <stop offset="100%" stop-color="#754DF6" />
    </linearGradient>

    <!-- Subtle Glow Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#F2512E" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base / Maskable safe area container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle inner border for premium dark finish -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#272B40" stroke-width="4" stroke-opacity="0.6" />

  <!-- Ambient background glow orb -->
  <circle cx="360" cy="160" r="140" fill="url(#brandGrad)" opacity="0.12" filter="blur(30px)" />
  <circle cx="160" cy="360" r="120" fill="url(#violetGrad)" opacity="0.1" filter="blur(30px)" />

  <!-- Main 'L' Monogram with stylized dynamic geometric curve -->
  <g filter="url(#glow)">
    <!-- Vertical stem of the L -->
    <rect x="156" y="128" width="60" height="256" rx="28" fill="url(#brandGrad)" />

    <!-- Horizontal base of the L with forward arrow/dynamic curve -->
    <rect x="156" y="324" width="200" height="60" rx="28" fill="url(#brandGrad)" />

    <!-- Sparkle / Star of Clarity & Productivity at top right -->
    <circle cx="332" cy="180" r="22" fill="#FFA588" />
    <path d="M 332 144 C 332 168 344 180 368 180 C 344 180 332 192 332 216 C 332 192 320 180 296 180 C 320 180 332 168 332 144 Z" fill="url(#brandGrad)" />
  </g>
</svg>
